title: regsvr32 Loads an Unsigned Module from a User-Writable Path
id: 911946e9-9843-4144-bcef-8bd7a5a4cfbf
status: experimental
description: A module loaded by regsvr32.exe is unsigned and resides in a directory writable by the user. Extension masquerading hides the module type but not the load event.
references:
  - https://thedfirreport.com/2021/11/29/continuing-the-bazar-ransomware-story/
author: rap1p1
date: 2026/10/23
logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith: '\\regsvr32.exe'
    Signed: 'false'
    ImageLoaded|contains:
      - '\\Users\\Public\\'
      - '\\Users\\'
      - '\\ProgramData\\'
      - '\\Windows\\Temp\\'
  condition: selection
falsepositives:
  - Unsigned in-house components registered by administrators
level: high
tags:
  - attack.defense_evasion
  - attack.t1218.010
  - attack.t1036.007
