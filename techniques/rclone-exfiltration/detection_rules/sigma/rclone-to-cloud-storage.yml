title: rclone Transfer to a Cloud Remote with Throttling Flags
id: 119047f0-11e0-48c7-82ef-ae97ed9d1187
status: experimental
description: rclone runs a copy operation against a named cloud remote and sets bandwidth or parallelism limits. The flags indicate a bulk transfer that was tuned to stay below saturation rather than a one-off manual copy.
references:
  - https://thedfirreport.com/2021/11/29/continuing-the-bazar-ransomware-story/
author: rap1p1
date: 2026/10/23
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\\rclone.exe'
    CommandLine|contains: ' copy '
  selection_flags:
    CommandLine|contains:
      - '--bwlimit'
      - '--transfers'
      - '--multi-thread-streams'
      - '--ignore-existing'
  selection_remote:
    CommandLine|contains:
      - 'Mega:'
      - 'mega:'
      - 'remote:'
  condition: selection and selection_flags and selection_remote
falsepositives:
  - Scheduled backup jobs that use rclone with bandwidth limits
level: high
tags:
  - attack.exfiltration
  - attack.t1567.002
  - attack.t1030
