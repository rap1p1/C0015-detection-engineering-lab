title: wmic Creates a Remote Process Running rundll32
id: dd506f40-d973-490a-a625-4521f8a9f63c
status: experimental
description: A wmic invocation uses process call create with a remote node and a rundll32 command line. The combination is a remote-execution pattern rather than local administration.
references:
  - https://thedfirreport.com/2021/11/29/continuing-the-bazar-ransomware-story/
author: rap1p1
date: 2026/10/23
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\\wmic.exe'
    CommandLine|contains:
      - 'process call create'
      - '/node:'
    CommandLine|contains|all:
      - 'rundll32'
  condition: selection
falsepositives:
  - Administrative scripts that deploy components through WMI
level: high
tags:
  - attack.lateral_movement
  - attack.t1047
