title: Office Application Spawns Shell or Script Host
id: 038567e6-88eb-4410-baf6-6b51f8fae03f
status: experimental
description: An Office process starts a command shell or script host. Macro execution in a weaponised document produces this edge before any payload is written.
references:
  - https://thedfirreport.com/2021/11/29/continuing-the-bazar-ransomware-story/
author: rap1p1
date: 2026/10/23
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\\WINWORD.EXE'
      - '\\EXCEL.EXE'
      - '\\POWERPNT.EXE'
      - '\\OUTLOOK.EXE'
  selection_child:
    Image|endswith:
      - '\\cmd.exe'
      - '\\mshta.exe'
      - '\\wscript.exe'
      - '\\cscript.exe'
      - '\\powershell.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Office add-ins that launch documented helper processes
level: medium
tags:
  - attack.execution
  - attack.t1204.002
  - attack.t1059.005
