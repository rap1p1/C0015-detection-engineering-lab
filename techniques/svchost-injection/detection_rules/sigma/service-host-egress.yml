title: Service Host Opens an Outbound Connection
id: a8ab518f-32e0-4140-929d-ac3a8da784ea
status: experimental
description: A svchost.exe instance makes an outbound connection to a non-local address. Service hosts listen and forward; they are not expected to originate client connections, and an injected beacon produces exactly this.
references:
  - https://thedfirreport.com/2021/11/29/continuing-the-bazar-ransomware-story/
author: rap1p1
date: 2026/10/23
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    Image|endswith: '\\svchost.exe'
    Initiated: 'true'
    DestinationPort:
      - 80
      - 443
      - 8080
  filter_local:
    DestinationIp|cidr:
      - '127.0.0.0/8'
      - '10.0.0.0/8'
      - '192.168.0.0/16'
  condition: selection and not filter_local
falsepositives:
  - Windows Update and telemetry from the service host
level: medium
tags:
  - attack.command_and_control
  - attack.t1071.001
