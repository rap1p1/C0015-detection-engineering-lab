title: PowerShell Runs PowerView Share Enumeration from a Download Cradle
id: 5af43b6d-b23b-40cb-b04f-0a41ff8b8e1b
status: experimental
description: A PowerShell command line downloads a remote script and calls Invoke-ShareFinder in the same invocation. The pattern keeps the tool off disk and writes results to a fixed path.
references:
  - https://thedfirreport.com/2021/11/29/continuing-the-bazar-ransomware-story/
author: rap1p1
date: 2026/10/23
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: '\\powershell.exe'
  selection_cradle:
    CommandLine|contains:
      - 'DownloadString'
      - 'Invoke-WebRequest'
      - 'IEX'
  selection_sharefinder:
    CommandLine|contains: 'Invoke-ShareFinder'
  condition: selection_image and selection_cradle and selection_sharefinder
falsepositives:
  - Administrative scripts that wrap PowerView for inventory
level: high
tags:
  - attack.discovery
  - attack.t1135
  - attack.t1059.001
