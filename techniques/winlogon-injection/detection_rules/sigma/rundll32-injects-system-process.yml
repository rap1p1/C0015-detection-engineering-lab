title: Module Loader Creates a Thread in a System Process
id: e95f9ba5-bbfc-49f5-b9e0-80cb220db6fb
status: experimental
description: rundll32.exe creates a remote thread in winlogon.exe, svchost.exe, services.exe, or lsass.exe. Process injection into a system-owned process is the mechanism that moves the implant into a SYSTEM context.
references:
  - https://thedfirreport.com/2021/11/29/continuing-the-bazar-ransomware-story/
author: rap1p1
date: 2026/10/23
logsource:
  category: create_remote_thread
  product: windows
detection:
  selection_source:
    SourceImage|endswith:
      - '\\rundll32.exe'
      - '\\regsvr32.exe'
      - '\\powershell.exe'
  selection_target:
    TargetImage|endswith:
      - '\\winlogon.exe'
      - '\\services.exe'
      - '\\lsass.exe'
      - '\\svchost.exe'
  condition: selection_source and selection_target
falsepositives:
  - Security products that instrument system processes
  - Debugging tools attached by an administrator
level: critical
tags:
  - attack.defense_evasion
  - attack.privilege_escalation
  - attack.t1055
  - attack.t1055.002
