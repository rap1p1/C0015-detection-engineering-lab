title: Locker Binary Started with the Conti Argument Set
id: 8f4c1a52-6d3e-4b9f-9a71-2c5e0d8b7f31
status: experimental
description: A binary whose name ends in _locker.exe is started with network mode, a chunk size, no mutex guard, and an administrative share path. The argument combination is specific to the Conti locker and survives a rename of the executable.
references:
  - https://thedfirreport.com/2021/11/29/continuing-the-bazar-ransomware-story/
author: rap1p1
date: 2026/10/23
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: '_locker.exe'
  selection_args:
    CommandLine|contains|all:
      - '-net'
      - '-nomutex'
      - '-size'
      - '-p \\'
  condition: selection_image and selection_args
falsepositives:
  - Unlikely outside a ransomware deployment
level: critical
tags:
  - attack.impact
  - attack.t1486
  - attack.t1021.002
