title: Discovery Binaries Started in Rapid Succession
id: e6feb324-eefc-4ef5-8de2-6f233f65f3ec
status: experimental
description: Several distinct discovery binaries are started by cmd.exe within a short window. Interactive administration rarely produces this density, and the sequence matches a scripted host and domain survey.
references:
  - https://thedfirreport.com/2021/11/29/continuing-the-bazar-ransomware-story/
author: rap1p1
date: 2026/10/23
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\\cmd.exe'
    Image|endswith:
      - '\\net.exe'
      - '\\net1.exe'
      - '\\nltest.exe'
      - '\\tasklist.exe'
      - '\\ping.exe'
      - '\\whoami.exe'
  condition: selection | count(Image) by Computer > 5
falsepositives:
  - Login scripts and inventory agents
level: medium
tags:
  - attack.discovery
  - attack.t1087
  - attack.t1482
  - attack.t1018
