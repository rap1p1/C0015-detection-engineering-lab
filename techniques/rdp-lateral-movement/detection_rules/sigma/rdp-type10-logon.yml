title: Interactive RDP Logon
id: c59167ae-3a35-45c3-8bb5-7cf1ea997cc7
status: experimental
description: A type 10 logon is recorded on a host. The event carries the source workstation name, which in a tunnelled session is the operator host rather than an estate member.
references:
  - https://thedfirreport.com/2021/11/29/continuing-the-bazar-ransomware-story/
author: rap1p1
date: 2026/10/23
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 10
  filter_machine:
    TargetUserName|endswith: '$'
  condition: selection and not filter_machine
falsepositives:
  - Legitimate remote administration
level: low
tags:
  - attack.lateral_movement
  - attack.t1021.001
