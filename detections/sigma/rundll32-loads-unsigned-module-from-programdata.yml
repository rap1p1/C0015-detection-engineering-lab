title: rundll32 Loads an Unsigned Module from ProgramData or a User Directory
id: 5b9e3d71-4a26-4c8f-b0d2-7e1f6a9c3b84
status: experimental
description: rundll32.exe loads a module from a staging directory outside Program Files. The same edge appears when the pivot beacon is created by WMI and when a loader is started manually, so the rule covers both paths.
references:
  - https://thedfirreport.com/2021/11/29/continuing-the-bazar-ransomware-story/
author: rap1p1
date: 2026/10/23
logsource:
  category: image_load
  product: windows
detection:
  selection:
    Image|endswith: '\\rundll32.exe'
    Signed: 'false'
    ImageLoaded|contains:
      - '\\ProgramData\\'
      - '\\Users\\Public\\'
      - '\\Windows\\Temp\\'
  condition: selection
falsepositives:
  - Unsigned vendor components staged by installers
level: high
tags:
  - attack.defense_evasion
  - attack.t1218.011
  - attack.t1036.001
