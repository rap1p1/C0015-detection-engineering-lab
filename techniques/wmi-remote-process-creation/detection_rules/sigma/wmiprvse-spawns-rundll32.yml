title: WMI Provider Host Spawns a Module Loader
id: 3ba2d690-5d1e-48df-be22-9ea849d15897
status: experimental
description: WmiPrvSE.exe creates rundll32.exe. WMI process creation is a remote-execution primitive, and the loader parent edge identifies the mechanism even when the calling host is not in the same log stream.
references:
  - https://thedfirreport.com/2021/11/29/continuing-the-bazar-ransomware-story/
author: rap1p1
date: 2026/10/23
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\\WmiPrvSE.exe'
    Image|endswith:
      - '\\rundll32.exe'
      - '\\regsvr32.exe'
      - '\\mshta.exe'
  condition: selection
falsepositives:
  - Management software that drives WMI process creation
level: high
tags:
  - attack.lateral_movement
  - attack.t1047
  - attack.t1218.011
