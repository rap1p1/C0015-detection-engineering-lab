title: Repeated DNS Lookups for Non-Existent Names
id: dd8170c4-bf6e-4dc3-ad7b-e5e99aae486c
status: experimental
description: A process repeatedly resolves names that do not exist. A beacon whose infrastructure was taken down produces this pattern while it retries its fallback list.
references:
  - https://thedfirreport.com/2021/11/29/continuing-the-bazar-ransomware-story/
author: rap1p1
date: 2026/10/23
logsource:
  category: dns_query
  product: windows
detection:
  selection:
    QueryStatus: '9003'
  condition: selection | count() by Image > 8
falsepositives:
  - Applications probing optional endpoints
  - Misconfigured clients with a stale server list
level: medium
tags:
  - attack.command_and_control
  - attack.t1071.004
