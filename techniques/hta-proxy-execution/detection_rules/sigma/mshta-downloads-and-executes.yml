title: mshta Downloads Content and Starts a Module Loader
id: cd9525a5-07f4-4f4b-bec1-921f69dc6493
status: experimental
description: mshta.exe reaches the network and then starts regsvr32.exe or rundll32.exe. The combination is characteristic of an HTA that stages a proxied DLL.
references:
  - https://thedfirreport.com/2021/11/29/continuing-the-bazar-ransomware-story/
author: rap1p1
date: 2026/10/23
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\\mshta.exe'
    Image|endswith:
      - '\\regsvr32.exe'
      - '\\rundll32.exe'
  condition: selection
falsepositives:
  - Legacy intranet applications that register components from an HTA
level: high
tags:
  - attack.defense_evasion
  - attack.t1218.005
  - attack.t1218.010
