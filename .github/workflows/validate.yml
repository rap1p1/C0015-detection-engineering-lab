name: validate

on:
  push:
  pull_request:

jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: catalog, hashes and tracked files
        run: python3 detections/tools/catalog.py --check
      - name: catalog index is current
        run: |
          python3 detections/tools/catalog.py --index
          git diff --exit-code detections/INDEX.md
      - name: markdown links
        run: python3 .github/scripts/check_links.py
