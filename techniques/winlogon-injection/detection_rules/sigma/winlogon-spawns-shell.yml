title: winlogon Spawns a Shell or Discovery Binary
id: a9883ef0-c1a0-41a7-954a-9a0394c10ed5
status: experimental
description: winlogon.exe starts cmd.exe, powershell.exe, or a discovery binary. The logon process does not start interactive shells under normal operation, and children inherit its SYSTEM token.
references:
  - https://thedfirreport.com/2021/11/29/continuing-the-bazar-ransomware-story/
author: rap1p1
date: 2026/10/23
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\\winlogon.exe'
    Image|endswith:
      - '\\cmd.exe'
      - '\\powershell.exe'
      - '\\rundll32.exe'
      - '\\net.exe'
      - '\\net1.exe'
      - '\\nltest.exe'
      - '\\whoami.exe'
      - '\\wmic.exe'
  condition: selection
falsepositives:
  - Accessibility and logon-script components started by winlogon
level: critical
tags:
  - attack.execution
  - attack.discovery
  - attack.t1059.003
