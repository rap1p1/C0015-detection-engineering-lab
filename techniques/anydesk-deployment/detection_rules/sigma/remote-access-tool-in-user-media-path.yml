title: Remote Access Tool Executed from a User Media Directory
id: ba8d7466-5abc-4a58-bc1f-3c2fb32c38b7
status: experimental
description: A remote-access binary runs from Videos, Music, or Pictures under a user profile. Installation media does not place executables in these directories, and the parent is usually explorer.exe because the operator starts it from the desktop.
references:
  - https://thedfirreport.com/2021/11/29/continuing-the-bazar-ransomware-story/
author: rap1p1
date: 2026/10/23
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|contains:
      - '\\Videos\\'
      - '\\Music\\'
      - '\\Pictures\\'
    Image|endswith:
      - '\\AnyDesk.exe'
      - '\\RustDesk.exe'
      - '\\TeamViewer.exe'
      - '\\ScreenConnect.ClientService.exe'
  condition: selection
falsepositives:
  - Users running portable applications from media folders
level: high
tags:
  - attack.command_and_control
  - attack.t1219.002
