title: Non-Client Process Opens an RDP Connection
id: 74cfadfc-2da4-4c93-a735-05f5bf799519
status: experimental
description: A process other than the RDP client initiates a connection to port 3389. Tunnelled RDP through an implant produces this, and the owning process is the implant host rather than a user application.
references:
  - https://thedfirreport.com/2021/11/29/continuing-the-bazar-ransomware-story/
author: rap1p1
date: 2026/10/23
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    Initiated: 'true'
    DestinationPort: 3389
  filter_client:
    Image|endswith:
      - '\\mstsc.exe'
      - '\\freerdp.exe'
      - '\\wfica32.exe'
  condition: selection and not filter_client
falsepositives:
  - RDP proxies and remote-support agents
level: high
tags:
  - attack.lateral_movement
  - attack.t1021.001
