title: Service Host Spawns rundll32
id: c6960268-1563-4d58-82ef-c0a7bc9bbbeb
status: experimental
description: svchost.exe starts rundll32.exe. The service host does not normally act as a parent for the module loader, and the edge places the child in the SYSTEM context.
references:
  - https://thedfirreport.com/2021/11/29/continuing-the-bazar-ransomware-story/
author: rap1p1
date: 2026/10/23
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\\svchost.exe'
    Image|endswith: '\\rundll32.exe'
  condition: selection
falsepositives:
  - Third-party services that shell out to rundll32 during start
level: high
tags:
  - attack.defense_evasion
  - attack.t1218.011
  - attack.t1543.003
